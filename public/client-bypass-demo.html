<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Client-side bypass demo</title>
    <style>
      body {
        margin: 0;
        font-family: "DM Sans", Arial, sans-serif;
        background: #0b1220;
        color: #e8eef8;
        padding: 48px;
      }
      h1 { font-family: Georgia, serif; margin: 0 0 12px; }
      p { color: #b7c4d8; }
      pre {
        background: #132038;
        border: 1px solid rgba(255,255,255,.12);
        padding: 16px;
        border-radius: 8px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .badge {
        display: inline-block;
        margin-top: 12px;
        padding: 8px 12px;
        background: #b42318;
        color: #fff;
        font-weight: 700;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Client-side validation bypass</h1>
    <p>
      Browser checks were skipped by calling <code>/api/insecure-login</code> directly.
      The raw response still contains HTML/script characters:
    </p>
    <pre id="out">Loading…</pre>
    <div id="badge" hidden class="badge">WEAKNESS CONFIRMED — server reflected unsanitized input</div>
    <script>
      const payload = {
        email: "bypass@test.com" + "<scr" + "ipt>/*stolen*/</scr" + "ipt>",
        password: "password1",
      };
      fetch("/api/insecure-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      })
        .then((r) => r.json())
        .then((d) => {
          document.getElementById("out").textContent = JSON.stringify(d, null, 2);
          if (String(d.message || "").includes("<script>")) {
            document.getElementById("badge").hidden = false;
          }
        });
    </script>
  </body>
</html>
