<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juice Shop — Secure Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="brand">
        <p class="brand-mark">OWASP Juice Shop</p>
        <h1>Sign in securely</h1>
        <p class="lede">
          Demo login with client-side checks and server-side validation —
          built for a web security assignment.
        </p>
      </header>

      <main>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              placeholder="you@example.com"
              maxlength="254"
              required
            />
            <p class="hint" id="email-hint" hidden></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="At least 8 characters"
              maxlength="128"
              required
            />
            <p class="hint" id="password-hint" hidden></p>
          </div>

          <button type="submit" id="submit-btn">Log in</button>
        </form>

        <p id="form-status" class="status" role="status" aria-live="polite"></p>

        <aside class="demo-note">
          <p>
            Demo account:
            <code>demo@juice.shop</code> /
            <code>JuiceShop1!</code>
          </p>
        </aside>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
